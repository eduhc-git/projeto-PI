<!DOCTYPE html> 
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ALCYE CAR · Mercado de Peças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { racing: ['"Chakra Petch"', 'sans-serif'], sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
</script>
<style>
:root{--glass:rgba(15,23,42,.75);--glass2:rgba(30,41,59,.65);--line:rgba(148,163,184,.18);--accent:#38bdf8;--accent2:#eab308;--danger:#ef4444;--ok:#22c55e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:#05070b;color:#e2e8f0;font-family:Inter,system-ui,sans-serif}
.font-racing{font-family:"Chakra Petch",sans-serif}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.glass-soft{background:var(--glass2);border:1px solid var(--line);border-radius:12px}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .9rem;border-radius:10px;border:1px solid var(--line);background:rgba(30,41,59,.65);color:#e2e8f0;font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:13px;letter-spacing:.03em;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:rgba(56,189,248,.55);background:rgba(14,116,144,.35)}
.btn.active{background:linear-gradient(135deg,rgba(14,165,233,.55),rgba(37,99,235,.45));border-color:#38bdf8;box-shadow:0 0 18px rgba(56,189,248,.25)}
.btn.primary{background:linear-gradient(135deg,#0ea5e9,#2563eb);border-color:#38bdf8}
.tab{padding:.5rem 1rem;font-family:"Chakra Petch";font-weight:600;font-size:13px;color:#94a3b8;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab.active{color:#e0f2fe;border-color:#38bdf8;background:rgba(56,189,248,.08)}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc;font-family:"Chakra Petch";font-weight:600}
select,input{background:rgba(2,6,23,.8);border:1px solid var(--line);border-radius:10px;color:#e2e8f0;padding:.5rem .7rem;font-size:13.5px;outline:none;width:100%}
select:focus,input:focus{border-color:#38bdf8}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#334155 transparent}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast > div{pointer-events:auto;padding:.6rem 1rem;font-size:13.5px;border-radius:12px;max-width:92vw}
</style>
<style>
body::after{content:'ALCYE CAR';position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(14,165,233,.14),transparent 45%),#050a12;color:#e2e8f0;font:700 1.15rem 'Chakra Petch',sans-serif;letter-spacing:.22em;opacity:0;transition:opacity .38s ease;pointer-events:none}
html.page-leaving body::after,html.page-entering body::after{opacity:1}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<script>
(()=>{const root=document.documentElement;try{if(sessionStorage.getItem('tuning-page-transition')==='1'){root.classList.add('page-entering');sessionStorage.removeItem('tuning-page-transition');document.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('page-entering'))),{once:true})}}catch(_){}document.addEventListener('click',event=>{const link=event.target.closest('a[href]');if(!link||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||link.target||link.hasAttribute('download'))return;const target=new URL(link.href,location.href);if(target.origin!==location.origin||!/\.html$/i.test(target.pathname)||target.href===location.href)return;event.preventDefault();root.classList.add('page-leaving');try{sessionStorage.setItem('tuning-page-transition','1')}catch(_){}setTimeout(()=>location.assign(target.href),240)})})();
</script>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

  <div class="max-w-6xl w-full flex flex-col gap-6">
    
    <!-- BARRA SUPERIOR / HEADER -->
    <header class="glass p-4 md:px-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 flex items-center justify-center flex-none"><img src="logo.png" alt="Logo ALCYE CAR" class="w-14 h-14 object-contain"></div>
        <div>
          <div class="font-racing font-bold text-lg tracking-wide text-white">MERCADO DE REPOSIÇÃO &amp; ADAPTAÇÕES <span class="text-sky-400">GT STYLE</span></div>
          <div class="text-[12px] text-slate-400">ALCYE CAR · Garagem e comunidade automotiva</div>
        </div>
      </div>
      <!-- Seletor de Veículo Global -->
      <div class="flex items-center gap-2 w-full md:w-auto">
        <span class="text-xs text-slate-400 font-racing uppercase tracking-wider">Veículo:</span>
        <select id="filtroCarro" onchange="atualizarCatalogo()" class="flex-1 md:w-64 font-semibold text-sky-300">
          <option value="gol">VW Gol Quadrado 1.6/1.8 (AP)</option>
          <option value="up">VW Up! 1.0 TSI (EA211)</option>
          <option value="subaru">Subaru Impreza WRX (EJ25)</option>
        </select>
      </div>
      <a href="tuning_dashboard.html" class="btn" title="Voltar para a garagem" aria-label="Voltar para a garagem"><i class="fa-solid fa-arrow-left"></i><span>Voltar para a garagem</span></a>
    </header>

    <!-- NAVEGAÇÃO DE ABAS PRINCIPAIS -->
    <div class="flex gap-2 border-b border-slate-800 pb-2 overflow-x-auto">
      <button onclick="mudarAbaPrincipal('catalogo')" id="tab-catalogo" class="tab active rounded-xl"><i class="fa-solid fa-screwdriver-wrench mr-2"></i>Catálogo & Compatibilidade</button>
      <button onclick="mudarAbaPrincipal('comunidade')" id="tab-comunidade" class="tab rounded-xl"><i class="fa-solid fa-comments mr-2"></i>Central da Comunidade (Envie sua Dica)</button>
    </div>

    <!-- SEÇÃO 1: CATÁLOGO DE PEÇAS -->
    <section id="secao-catalogo" class="space-y-4">
      <!-- Sub-abas de Categorias -->
      <div class="flex gap-2 overflow-x-auto pb-1">
        <button onclick="filtrarCategoria('motor')" id="cat-motor" class="btn active"><i class="fa-solid fa-gear"></i>Motor & Bloco</button>
        <button onclick="filtrarCategoria('suspensao')" id="cat-suspensao" class="btn"><i class="fa-solid fa-arrows-down-to-line"></i>Suspensão & Freios</button>
        <button onclick="filtrarCategoria('admissao')" id="cat-admissao" class="btn"><i class="fa-solid fa-wind"></i>Admissão & Escape</button>
      </div>

      <!-- Grid de Peças -->
      <div id="grid-pecas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Injetado dinamicamente via JS -->
      </div>
    </section>

    <!-- SEÇÃO 2: CENTRAL DA COMUNIDADE (FÓRUM COLABORATIVO) -->
    <section id="secao-comunidade" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Formulário -->
      <div class="glass p-5 space-y-4 lg:col-span-1">
        <div class="font-racing font-bold text-base text-white"><i class="fa-solid fa-lightbulb text-amber-400 mr-2"></i>Adicionar Adaptação</div>
        <p class="text-xs text-slate-400">Conhece uma peça alternativa ou um "segredo de oficina"? Compartilhe com a comunidade acadêmica.</p>
        
        <form id="formDica" onsubmit="adicionarDica(event)" class="space-y-3">
          <div>
            <label class="lbl block mb-1">Veículo Alvo</label>
            <select id="novoCarro">
              <option value="VW Gol Quadrado">VW Gol Quadrado</option>
              <option value="VW Up! TSI">VW Up! TSI</option>
              <option value="Subaru Impreza">Subaru Impreza</option>
            </select>
          </div>
          <div>
            <label class="lbl block mb-1">Nome da Peça / Modificação</label>
            <input type="text" id="novaPeca" placeholder="Ex: Bomba de Óleo do Gol 16v no AP" required>
          </div>
          <div>
            <label class="lbl block mb-1">Peça Alternativa / Adaptação</label>
            <input type="text" id="novaAlt" placeholder="Ex: Maior vazão sem trocar o bloco" required>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="lbl block mb-1">Preço Original (R$)</label>
              <input type="number" id="novoPrecoOrig" placeholder="400" required>
            </div>
            <div>
              <label class="lbl block mb-1">Preço Alternativo (R$)</label>
              <input type="number" id="novoPrecoAlt" placeholder="180" required>
            </div>
          </div>
          <div>
            <label class="lbl block mb-1">Seu Nome / Oficina</label>
            <input type="text" id="novoAutor" placeholder="Ex: João Mecânico (Franca)" required>
          </div>
          <button type="submit" class="btn primary w-full justify-center mt-2"><i class="fa-solid fa-paper-plane"></i>Publicar Dica</button>
        </form>
      </div>

      <!-- Feed de Dicas -->
      <div class="lg:col-span-2 space-y-4">
        <div class="flex justify-between items-center">
          <div class="font-racing font-bold text-base text-white">Dicas Validadas por Especialistas</div>
          <span class="text-xs px-2.5 py-1 rounded-md glass-soft text-emerald-400"><i class="fa-solid fa-circle-check mr-1"></i>Tempo real</span>
        </div>
        <div id="feed-comunidade" class="flex flex-col gap-3">
          <!-- Injetado via JS -->
        </div>
      </div>
    </section>

  </div>

  <div class="toast" id="toast"></div>

<script>
const BRL = v => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function toast(msg, type = 'info') {
  const d = document.createElement('div');
  d.className = 'glass';
  d.innerHTML = `<i class="fa-solid fa-circle-info text-sky-400 mr-2"></i>${msg}`;
  document.getElementById('toast').appendChild(d);
  setTimeout(() => { d.style.opacity = 0; setTimeout(() => d.remove(), 400); }, 3500);
}

// Base de Dados Completa e Detalhada
const BANCO_PECAS = {
  gol: [
    { cat: 'motor', nome: 'Biela Forjada / Adaptada', orig: 'Biela Original VW AP', pOrig: 480, alt: 'Biela Corsa 1.8 (Família II)', pAlt: 230, status: 'Requer leve desbaste na saia', desc: 'Amplamente utilizada na preparação de motores AP aspirados e turbos de baixo custo com excelente resistência mecânica.' },
    { cat: 'motor', nome: 'Bomba de Óleo de Alta Vazão', orig: 'Original AP 1.8', pOrig: 380, alt: 'Bomba do Gol 1.0 16v / Power', pAlt: 160, status: 'Encaixe direto', desc: 'Garante maior pressão de óleo em giros elevados para motores preparados com turbo.' },
    { cat: 'motor', nome: 'Jogo de Pistões de Alta Taxa', orig: 'Pistão Standard Gasolina', pOrig: 650, alt: 'Pistão Gol Álcool / Turbo Original', pAlt: 390, status: 'Plug & Play', desc: 'Opção econômica para taxar o motor ou rodar com kit turbo inicial.' },
    { cat: 'suspensao', nome: 'Amortecedores Preparados', orig: 'Original Cofap AP', pOrig: 750, alt: 'Amortecedor encurtado linha Santana', pAlt: 480, status: 'Compatibilidade na torre', desc: 'Mantém o carro firme ao rebaixar sem perder totalmente o curso útil.' },
    { cat: 'suspensao', nome: 'Kit de Suspensão de Rosca', orig: 'Conjunto Original Fixo', pOrig: 1600, alt: 'Kit Rosca Nacional Ajustável', pAlt: 920, status: 'Regulagem de altura', desc: 'Permite ajustar a altura do veículo para eventos ou uso diário.' },
    { cat: 'admissao', nome: 'Filtro de Ar Esportivo Cônico', orig: 'Caixa de ar original restrita', pOrig: 280, alt: 'Filtro Duplo Fluxo Universal', pAlt: 110, status: 'Ganho de captação de ar', desc: 'Melhora o fluxo de admissão e deixa o ronco do motor mais encorpado.' }
  ],
  up: [
    { cat: 'motor', nome: 'Velas de Ignição Iridium', orig: 'Original VW OEM TSI', pOrig: 340, alt: 'Vela NGK Iridium equivalente Fiat/GM', pAlt: 200, status: 'Mesmo grau térmico', desc: 'Essencial para queima perfeita em motores turbo de injeção direta.' },
    { cat: 'motor', nome: 'Válvula de Alívio Reforçada (Blow Off)', orig: 'Original Plástica de Fábrica', pOrig: 450, alt: 'Kit Reparo em Alumínio Usinado', pAlt: 180, status: 'Alta durabilidade', desc: 'Evita vazamentos de pressão comuns na original plástica quando se eleva o boost.' },
    { cat: 'suspensao', nome: 'Molas Esportivas Reduzidas', orig: 'Original Up! TSI', pOrig: 720, alt: 'Molas Helicoidais Progressivas', pAlt: 460, status: 'Rebaixamento de 4cm', desc: 'Melhora a estabilidade nas curvas sem fim de curso seco.' },
    { cat: 'admissao', nome: 'Downpipe em Inox 2.5"', orig: 'Catalisador Original Restrito', pOrig: 1300, alt: 'Downpipe Direto Artesanal Inox', pAlt: 580, status: 'Performance Stage 1', desc: 'Elimina a restrição do catalisador original, liberando potência e torque.' }
  ],
  subaru: [
    { cat: 'motor', nome: 'Bomba de Combustível de Alta Vazão', orig: 'Original Subaru STI JDM', pOrig: 1900, alt: 'Bomba Walbro 255LPH Universal', pAlt: 480, status: 'Adaptação simples no pescador', desc: 'Entrega a vazão necessária para motores boxer turbinados importados.' },
    { cat: 'suspensao', nome: 'Kit Coilovers Reguláveis', orig: 'Suspensão Original WRX Bilstein', pOrig: 4800, alt: 'Coilovers Genéricos Importados Ajustáveis', pAlt: 2200, status: 'Regulagem completa', desc: 'Controle preciso de altura e dureza para track days.' }
  ]
};

let dicasComunidade = [
  { carro: 'VW Gol Quadrado', peca: 'Bobina de Ignição do VW Gol MI (G3)', alt: 'Substitui o sistema platina/torque antigo por ignição estática mais forte', pOrig: 320, pAlt: 130, autor: 'Carlos Oficina (Franca/SP)' },
  { carro: 'VW Up! TSI', pular: true, peca: 'Fluido de Freio DOT 5.1 de alta performance', alt: 'Maior ponto de ebulição em frenagens severas na pista', pOrig: 190, pAlt: 90, autor: 'Marcos Tuning SP' }
];

let categoriaAtiva = 'motor';

function mudarAbaPrincipal(aba) {
  document.getElementById('secao-catalogo').classList.toggle('hidden', aba !== 'catalogo');
  document.getElementById('secao-comunidade').classList.toggle('hidden', aba !== 'comunidade');
  document.getElementById('tab-catalogo').classList.toggle('active', aba === 'catalogo');
  document.getElementById('tab-comunidade').classList.toggle('active', aba === 'comunidade');
  if(aba === 'comunidade') renderizarComunidade();
}

function filtrarCategoria(cat) {
  categoriaAtiva = cat;
  ['motor', 'suspensao', 'admissao'].forEach(c => {
    document.getElementById(`cat-${c}`).classList.toggle('active', c === cat);
  });
  atualizarCatalogo();
}

function atualizarCatalogo() {
  const carro = document.getElementById('filtroCarro').value;
  const grid = document.getElementById('grid-pecas');
  const pecas = BANCO_PECAS[carro] || [];
  const filtradas = pecas.filter(p => p.cat === categoriaAtiva);

  grid.innerHTML = '';
  if(filtradas.length === 0) {
    grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs uppercase tracking-widest glass-soft">Nenhuma peça cadastrada nesta categoria para este veículo.</div>`;
    return;
  }

  filtradas.forEach(item => {
    const diff = item.pOrig - item.pAlt;
    const card = document.createElement('div');
    card.className = "glass p-5 flex flex-col justify-between hover:border-sky-500/50 transition group";
    card.innerHTML = `
      <div>
        <div class="flex justify-between items-start gap-2 mb-2">
          <h3 class="font-racing text-base font-bold text-white group-hover:text-sky-400 transition">${item.nome}</h3>
          <span class="text-[10px] bg-sky-950 text-sky-300 px-2.5 py-0.5 rounded-md border border-sky-800/60 font-semibold">${item.status}</span>
        </div>
        <p class="text-xs text-slate-400 mb-4 leading-relaxed">${item.desc}</p>
        
        <div class="glass-soft p-3.5 space-y-2 mb-4">
          <div class="flex justify-between text-xs">
            <span class="text-slate-400">${item.orig}</span>
            <span class="text-slate-400 line-through font-semibold">${BRL(item.pOrig)}</span>
          </div>
          <div class="flex justify-between text-xs font-bold pt-1 border-t border-slate-700/50">
            <span class="text-emerald-400">💡 ${item.alt}</span>
            <span class="text-emerald-400">${BRL(item.pAlt)}</span>
          </div>
        </div>
      </div>
      <div class="pt-3 border-t border-slate-800 flex justify-between items-center">
        <span class="text-xs font-extrabold text-amber-400">⚡ Economia de ${BRL(diff)}</span>
        <button onclick="toast('Peça equipada no projeto!')" class="btn primary text-xs py-1.5 px-3">Equipar Peça</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function renderizarComunidade() {
  const feed = document.getElementById('feed-comunidade');
  feed.innerHTML = '';
  dicasComunidade.forEach(dica => {
    const diff = dica.pOrig - dica.pAlt;
    const card = document.createElement('div');
    card.className = "glass p-4 space-y-3";
    card.innerHTML = `
      <div class="flex justify-between items-start">
        <div>
          <span class="text-[10px] font-bold uppercase bg-sky-950 text-sky-400 px-2 py-0.5 rounded border border-sky-800">${dica.carro}</span>
          <h3 class="font-racing text-base font-bold text-white mt-1">${dica.peca}</h3>
        </div>
        <span class="text-xs text-slate-400">Por: <strong class="text-slate-200">${dica.autor}</strong></span>
      </div>
      <p class="text-xs text-slate-300 glass-soft p-3">🛠️ <strong>Adaptação:</strong> ${dica.alt}</p>
      <div class="flex justify-between items-center pt-2 border-t border-slate-800/60 text-xs">
        <span class="text-slate-400">Original: <span class="line-through">${BRL(dica.pOrig)}</span> | Alternativa: <strong class="text-emerald-400">${BRL(dica.pAlt)}</strong></span>
        <span class="text-amber-400 font-bold">Economia: ${BRL(diff)}</span>
      </div>
    `;
    feed.appendChild(card);
  });
}

function adicionarDica(e) {
  e.preventDefault();
  const nova = {
    carro: document.getElementById('novoCarro').value,
    peca: document.getElementById('novaPeca').value,
    alt: document.getElementById('novaAlt').value,
    pOrig: Number(document.getElementById('novoPrecoOrig').value),
    pAlt: Number(document.getElementById('novoPrecoAlt').value),
    autor: document.getElementById('novoAutor').value + ' (FATEC)'
  };
  dicasComunidade.unshift(nova);
  document.getElementById('formDica').reset();
  mudarAbaPrincipal('comunidade');
  toast('Sua dica foi publicada com sucesso!');
}

window.onload = atualizarCatalogo;
</script>
</body>
</html>
